set -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# set -g prefix C-s
set -g prefix C-Space

# reload config
unbind r
bind r source-file ~/.tmux.conf

bind -r Space last-window

bind-key s display-popup -E "tmux switch -t \$(tmux list-sessions -F '#S' | fzf)"

set -s command-alias[10] atsc="attach-session -c '#{pane_current_path}'"

# for image.nvim
set -gq allow-passthrough on
set -g visual-activity off

set -g mouse on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# colorpalette
mauve="#cba6f7"
sapphire="#74c7ec"
text="#cdd6f4"
overlay0="#6c7086"
base="#1e1e2e"
mantle="#181825"
crust="#11111b"

# style
set -g status-position bottom
set -g status-left-length 100
set -g status-style "fg=${text},bg=${mantle}"
set -g status-left "#[fg=${sapphire},bold] #S #[fg=${text},nobold]| "
set -g status-left ""
set -g status-right "#[fg=${sapphire},bold] #S #[fg=${text},nobold]| %H:%M"
set -g window-status-current-format "#[fg=${sapphire},bold]#[underscore][#I]#W"
set -g window-status-format "[#I]#W#F"
set -g mode-style "fg=${base},bg=${sapphire}"
set -g pane-border-style "fg=${overlay0}"
set -g pane-active-border-style "fg=${mauve}"
set -g message-style "fg=${mauve},bg=${mantle}"
# endstyle


#set -g @catppuccin_flavour 'mocha'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
#set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# set -g escape-time 0
# set -g repeat-tim 1000

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
